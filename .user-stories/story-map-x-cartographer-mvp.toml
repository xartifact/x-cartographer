[project]
name = "X-Cartographer"
version = "2.0"
created_at = "2025-01-07"
updated_at = "2026-08-16"
description = "AI-Native 的研发需求与任务管理工具：基于 LLM 将自然语言需求分析为结构化用户故事，以故事地图可视化规划，拆解为可执行任务，贯穿研发全流程进行任务管理"
tech_stack = ["TypeScript", "Next.js", "bulletproof-react", "PGlite", "Drizzle ORM", "Hono", "React Flow"]

# ==================== 用户旅程 1: AI 需求分析 ====================
[[user_journeys]]
id = "UJ-001"
name = "AI 需求分析"
description = "用户通过自然语言描述产品需求，LLM 帮助分析和结构化需求，并可直接采纳为项目骨架"
persona = "产品经理"

[[user_journeys.stories]]
id = "US-001"
title = "作为产品经理，我想要通过自然语言输入产品需求，以便快速记录想法"
description = "提供文本输入界面，支持多行输入，用户可以用自然语言描述产品功能、用户场景等"
priority = "high"
status = "done"
estimation = 8
acceptance_criteria = [
  "提供文本输入框，支持多行输入",
  "支持 Markdown 格式预览",
  "输入内容可以保存为草稿",
  "界面简洁易用，符合 MVP 标准"
]
tags = ["MVP", "核心功能", "AI交互"]

[[user_journeys.stories]]
id = "US-002"
title = "作为产品经理，我想要 LLM 分析我的需求描述，以便识别关键用户和使用场景"
description = "调用 LLM API 分析用户输入的需求文本，提取用户角色、功能点、使用场景等结构化信息"
priority = "high"
status = "done"
estimation = 13
acceptance_criteria = [
  "集成 LLM API（OpenAI、Anthropic、X-Herald）",
  "自动识别用户角色（personas）",
  "提取核心功能点和使用场景",
  "以结构化格式展示分析结果",
  "支持用户确认或修改 LLM 分析结果"
]
tags = ["AI分析"]

[[user_journeys.stories]]
id = "US-003"
title = "作为产品经理，我想要查看 LLM 建议的用户旅程，以便规划产品功能结构"
description = "基于需求分析结果，LLM 生成建议的用户旅程地图，包含关键步骤和优先级"
priority = "high"
status = "done"
estimation = 13
acceptance_criteria = [
  "自动生成用户旅程建议",
  "每个旅程包含清晰的步骤描述",
  "提供优先级建议（high/medium/low）",
  "支持用户编辑和调整旅程",
  "生成符合用户故事地图方法论的结构"
]
tags = ["AI生成"]

[[user_journeys.stories]]
id = "US-037"
title = "作为技术负责人，我想要将需求分析直接采纳为项目结构，以便快速搭建需求骨架"
description = "需求分析结果（用户角色、功能点）与 LLM 生成的旅程建议可直接采纳，批量写入项目形成故事地图骨架"
priority = "high"
status = "done"
estimation = 5
acceptance_criteria = [
  "分析结果可确认并采纳",
  "旅程建议支持单个/批量采纳",
  "采纳后自动创建旅程与故事骨架",
