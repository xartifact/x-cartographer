title = "作为产品经理，我想要 LLM 分析我的需求描述，以便识别关键用户和使用场景"
description = "调用 LLM API 分析用户输入的需求文本，提取用户角色、功能点、使用场景等结构化信息"
priority = "medium"
status = "done"
estimation = 13
acceptance_criteria = [
  "集成 LLM API（OpenAI GPT-4 和 Anthropic Claude）",
  "自动识别用户角色（personas）",
  "提取核心功能点和使用场景",
  "以结构化格式展示分析结果",
  "支持用户确认或修改 LLM 分析结果"
]
tags = ["AI分析"]

[[user_journeys.stories]]
id = "US-003"
title = "作为产品经理，我想要查看 LLM 建议的用户旅程，以便规划产品功能结构"
