  "LLM 自动将用户故事拆解为任务列表",
  "每个任务 2-4 小时可完成",
  "任务包含清晰的描述和验收标准",
  "识别任务间的依赖关系",
  "任务分类（user_story/technical_task/bug_fix/spike）"
]
tags = ["MVP", "核心功能", "AI拆解", "任务管理"]

[[user_journeys.stories]]
id = "US-012"
title = "作为技术负责人，我想要为任务设置优先级和估算，以便规划开发排期"
