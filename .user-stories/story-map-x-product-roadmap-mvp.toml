title = "作为开发者，我想要随时停止正在执行的 AI 编码任务，以便在出现问题时及时中断"
description = "提供停止按钮，支持通过 AbortController 中断 SSE 流和服务端子进程，服务端通过 SIGTERM + SIGKILL 确保进程终止"
priority = "medium"
status = "done"
estimation = 3
acceptance_criteria = [
  "执行过程中显示'停止'按钮",
  "点击停止后中断 SSE 流",
  "服务端正确终止子进程（SIGTERM → 500ms → SIGKILL）",
  "停止后任务标记为'用户手动停止'",
  "关闭弹窗时自动中止执行"
]
tags = ["AI执行", "中断控制"]

[[user_journeys.stories]]
id = "US-028"
title = "作为技术负责人，我想要执行完成后自动更新任务状态，以便追踪开发进度"
description = "AI 编码代理执行成功后，自动将任务状态从 in_progress 变更为 in_review，执行失败时保持当前状态"
priority = "medium"
status = "done"
estimation = 3
acceptance_criteria = [
  "执行开始时任务状态自动变为 in_progress",
  "执行成功后（exitCode === 0）任务状态自动变为 in_review",
  "执行失败时任务状态不变",
  "状态变更通过现有的状态管理流程持久化到数据库"
]
tags = ["AI执行", "状态流转"]

[[user_journeys.stories]]
