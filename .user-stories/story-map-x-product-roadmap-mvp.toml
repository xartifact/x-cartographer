status = "done"
estimation = 13
acceptance_criteria = [
  "自动生成用户旅程建议",
  "每个旅程包含清晰的步骤描述",
  "提供优先级建议（high/medium/low）",
  "支持用户编辑和调整旅程",
  "生成符合用户故事地图方法论的结构"
]
tags = ["AI生成"]

