priority = "medium"
estimation = 5
acceptance_criteria = [
  "支持设置任务优先级（P0/P1/P2/P3）",
  "支持输入工时估算（小时）",
  "支持标记任务依赖关系",
  "自动计算总工时",
  "提供甘特图或时间线预览"
]
tags = ["MVP", "任务规划", "估算"]

[[user_journeys.stories]]
id = "US-013"
title = "作为开发团队，我想要导出用户故事地图为 TOML 格式，以便集成到开发流程"
description = "支持导出完整的用户故事地图为标准 TOML 格式文件"
priority = "high"
