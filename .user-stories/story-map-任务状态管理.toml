[project]
name = "任务状态管理"
version = "1.1"
created_at = "2026-01-10"
updated_at = "2026-04-08"
description = "在UI中标记和管理任务/需求的开发状态"
tech_stack = ["TypeScript", "Next.js", "bulletproof-react", "PGlite", "Drizzle ORM"]

# ==================== 用户旅程定义 ====================

[[user_journeys]]
id = "UJ-001"
name = "查看任务状态"
persona = "开发者、产品经理、团队成员"
description = "用户需要能够快速识别任务和需求当前的开发状态"

[[user_journeys.stories]]
id = "US-001"
title = "作为开发者，我想要在任务列表中看到每个任务的状态标签"
description = "在任务卡片或列表项上显示状态标签（如待办、进行中、已完成），使用颜色区分不同状态"
priority = "high"
status = "done"
acceptance_criteria = [
  "任务列表显示状态标签",
  "状态标签使用颜色区分（待办=灰色，进行中=蓝色，已完成=绿色）",
  "标签文字清晰可读"
]
estimation = 2
tags = ["ui", "task", "status"]

[[user_journeys.stories]]
id = "US-002"
title = "作为产品经理，我想要在故事地图中查看需求的状态概览"
description = "在故事地图视图中，通过颜色或标记显示每个用户故事的开发状态"
priority = "high"
status = "done"
acceptance_criteria = [
  "故事卡片上显示状态标签",
  "支持按状态筛选故事",
  "状态变更不影响其他功能"
]
estimation = 3
tags = ["ui", "story", "status"]

[[user_journeys.stories]]
id = "US-003"
title = "作为团队成员，我想要看到全局的项目进度统计"
description = "在项目首页或仪表盘显示进度概览：总任务数、各状态数量、完成百分比"
priority = "medium"
status = "done"
acceptance_criteria = [
  "显示待办/进行中/已完成数量",
  "显示完成百分比",
  "数据实时更新"
]
estimation = 2
tags = ["dashboard", "progress"]

# ==================== 用户旅程定义 ====================

[[user_journeys]]
id = "UJ-002"
name = "管理任务状态"
persona = "开发者、产品经理、团队成员"
description = "用户需要能够更新任务和需求的状态"

[[user_journeys.stories]]
id = "US-004"
title = "作为开发者，我想要一键更新任务状态"
description = "在任务卡片上提供状态切换功能，点击后可选择新状态"
priority = "high"
status = "done"
acceptance_criteria = [
  "点击任务卡片可切换状态",
  "状态切换后立即更新显示",
  "支持的状态：待办、进行中、已完成"
]
estimation = 3
tags = ["ui", "task", "interaction"]

[[user_journeys.stories]]
id = "US-005"
title = "作为产品经理，我想要批量更新需求状态"
description = "支持选中多个用户故事，一次性更新为相同状态"
priority = "medium"
status = "done"
acceptance_criteria = [
  "支持多选用户故事",
  "批量更新状态功能正常",
  "更新后所有选中项状态一致"
]
estimation = 3
tags = ["ui", "bulk", "story"]

[[user_journeys.stories]]
id = "US-006"
title = "作为团队成员，我想要查看状态变更历史"
description = "记录每次状态变更的时间、操作人和从什么状态变为什么状态"
priority = "low"
status = "done"
acceptance_criteria = [
  "保存状态变更记录",
  "可查看单个任务的变更历史",
  "历史记录按时间倒序排列"
]
estimation = 4
tags = ["audit", "history"]

# ==================== 用户旅程定义 ====================

[[user_journeys]]
id = "UJ-003"
name = "状态筛选和视图"
persona = "开发者、产品经理、团队成员"
description = "用户需要能够按状态筛选和查看不同视图"

[[user_journeys.stories]]
id = "US-007"
title = "作为开发者，我想要按状态筛选我的待办任务"
description = "提供状态筛选器，支持查看特定状态的任务列表"
priority = "high"
status = "done"
acceptance_criteria = [
  "筛选器显示所有可用状态选项",
  "支持单选和多选状态",
  "筛选结果实时更新"
]
estimation = 2
tags = ["filter", "view"]

[[user_journeys.stories]]
id = "US-008"
title = "作为产品经理，我想要切换不同的状态视图"
description = "提供视图切换功能：全部视图、仅待办、仅进行中、仅已完成"
priority = "medium"
status = "done"
acceptance_criteria = [
  "提供视图切换按钮/选项卡",
  "切换视图后只显示对应状态的项目",
  "当前视图状态清晰可见"
]
estimation = 2
tags = ["view", "switch"]

[[user_journeys.stories]]
id = "US-009"
title = "作为团队成员，我想要保存常用的状态筛选配置"
description = "支持保存筛选条件为预设，方便快速切换常用视图"
priority = "low"
status = "done"
acceptance_criteria = [
  "支持保存自定义筛选",
  "可从预设列表快速应用",
  "预设可编辑和删除"
]
estimation = 3
tags = ["filter", "preset"]

# ==================== 验收标准 ====================

[acceptance_criteria]
status_labels = [
  { id = "backlog", label = "待办", color = "gray" },
  { id = "todo", label = "待办", color = "slate" },
  { id = "in_progress", label = "进行中", color = "blue" },
  { id = "done", label = "已完成", color = "green" },
  { id = "cancelled", label = "已取消", color = "red" }
]

[metadata]
version = "1.1"
author = "product-designer"
notes = "所有功能已实现：StatusBadge、StatusFilter、StatusSelect、BulkUpdateDialog、PresetManager、ViewSwitcher、StatusOverview、ProgressStats、StatusHistory 组件均已完成"
