name: Docker Build & Deploy

on:
  push:
    branches:
      - main
      - develop
      - ci/**
      - feat/**
      - fix/**
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 部署目录在 /opt（非 ~/Docker）：runner 已迁移到 AUR 包 github-actions-bin，
  # 其 systemd 沙箱含 InaccessiblePaths=/home，无法访问 ~/Docker。
  DEPLOY_DIR: /opt/xartifact/x-cartographer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=alpha,enable=${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    # 兜底超时：self-hosted job 排队无上限（GitHub 6h 默认超时只对托管 runner 生效），
    # 若 runner 离线会永久挂起。2026-09-09 曾因此积压 4 个 run。
    # 注意：本超时只在 job 开始执行后计时，排队阶段不受控。
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy to server
        env:
          # main/develop 部署 latest；其他分支（feat/**, fix/**, ci/**）部署 alpha
          IMAGE_TAG: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'latest' || 'alpha' }}
        run: |
          cd ${{ env.DEPLOY_DIR }}

          echo "Pulling image tag: $IMAGE_TAG"
          docker pull ghcr.io/${{ github.repository }}:$IMAGE_TAG


          # 迁移由容器入口自动执行（apps/server/src/entrypoint.ts）：
          #   先迁移（幂等），成功才启动网关；失败则容器退出由 restart: always 重试。
          echo "Starting services..."
          docker-compose up -d

          echo "Waiting for service to be ready..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' x-cartographer 2>/dev/null || echo "unknown")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
              echo "✗ Container has stopped (status: $CONTAINER_STATUS)"
              echo "Container logs:"
              docker-compose logs x-cartographer
              exit 1
            fi

            # 就绪探针（非 liveness）：校验 DB 可达 + schema 与当前代码一致。
            # 2026-09-15 事故：新代码部署但库未迁移，老 /health 硬编码 200 使该状态被误判成功，
            # 结果是"部署通过、全站 API 500"。就绪探针让这类半迁移状态在部署阶段即失败。
            READY_RESP=$(docker exec x-cartographer bun -e "fetch('http://localhost:8787/health/ready').then(async r=>console.log(r.status + ' ' + (await r.text()).slice(0,300))).catch(()=>console.log('0 unreachable'))" 2>/dev/null || echo "0 exec-failed")
            HTTP_CODE=$(echo "$READY_RESP" | cut -d' ' -f1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is ready (HTTP 200, schema verified)"
              break
            fi

            # 就绪失败但进程存活 = schema/DB 问题，直接暴露详情终止，不必耗尽重试
            if [ "$HTTP_CODE" = "503" ]; then
              echo "✗ Service is NOT ready (HTTP 503): $READY_RESP"
              echo "  提示：多为数据库未迁移。执行 bun scripts/run-migrate-story-map.ts"
              docker-compose logs --tail=50 x-cartographer
              exit 1
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "✗ Health check timeout after $MAX_RETRIES attempts (150s)"
              echo "Container logs:"
              docker-compose logs --tail=50 x-cartographer
              exit 1
            fi

            echo "  Attempt $RETRY_COUNT/$MAX_RETRIES (HTTP: $HTTP_CODE), retrying in 5s..."
            sleep 5
          done

          echo ""
          echo "Container status:"
          docker-compose ps

          echo ""
          echo "Cleaning up old images..."
          docker image prune -f

  notify:
    needs: [build, deploy]
    # 通知不碰部署机（只发一个 HTTP 请求），必须跑托管 runner：
    # 它正是「部署失败」的告警通道，若与 deploy 共用 self-hosted，
    # runner 一离线告警也跟着静默（2026-09-09 实际发生）。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_TAG: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'latest' || 'alpha' }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="✅ 部署成功"
            COLOR="65280"           # Discord green
          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            STATUS="⏭️ 部署跳过"
            COLOR="9807270"          # Discord grey
          else
            STATUS="❌ 部署失败"
            COLOR="15548997"         # Discord red
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          # 取第一行作为提交信息
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg color "$COLOR" \
            --arg branch "$REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$FIRST_LINE" \
            --arg actor "$ACTOR" \
            --arg build "$BUILD_RESULT" \
            --arg tag "$IMAGE_TAG" \
            --arg url "$ACTION_URL" \
            '{
              embeds: [
                {
                  title: "\($status) - x-cartographer",
                  color: ($color | tonumber),
                  fields: [
                    { name: "分支", value: $branch, inline: true },
                    { name: "提交", value: "`\($sha)`", inline: true },
                    { name: "信息", value: $msg, inline: false },
                    { name: "触发", value: $actor, inline: true },
                    { name: "构建", value: $build, inline: true },
                    { name: "镜像", value: "`\($tag)`", inline: true }
                  ],
                  url: $url
                }
              ]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"