name: CI

on:
  # 与 docker-build.yml 对齐：本仓库日常开发在 feat/**（fix/** 亦常用），
  # 只挂 main/develop 会让日常提交完全不经过质量门禁（实测：最近 8 次
  # feat/core push 只有 Docker 流水线在跑，CI 一次都没触发）。
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck server
        run: bunx tsc --noEmit -p apps/server/tsconfig.json

      - name: Typecheck web
        run: bunx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck CLI
        run: bunx tsc --noEmit -p apps/cli/tsconfig.json

      - name: Lint
        run: bun run lint

      # Root test script covers server, CLI, and shared domain tests. It ensures CLI
      # flag wiring and the common predictability metric are exercised together.
      - name: Run server, CLI, and shared tests
        run: bun run test

      # 走包内脚本：vitest 的 include 是相对配置文件的 src/**，从仓库根执行会
      # 找不到测试文件（且误收 e2e 的 Playwright spec 与别处的 bun:test 文件）
      - name: Run web unit tests
        run: bun run --cwd apps/web test