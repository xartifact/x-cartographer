name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck server
        run: bunx tsc --noEmit -p apps/server/tsconfig.json

      - name: Typecheck web
        run: bunx tsc --noEmit -p apps/web/tsconfig.json

      - name: Typecheck CLI
        run: bunx tsc --noEmit -p apps/cli/tsconfig.json

      - name: Run server API tests
        run: bun test apps/server/src/__tests__/

      - name: Run web unit tests
        run: bunx vitest run --config apps/web/vitest.config.ts